name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q bus-manager-apk.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleNormalDebug assembleModDebug --no-daemon
        working-directory: bus-manager-apk
      - uses: actions/upload-artifact@v4
        with:
          name: BusManager-normal
          path: bus-manager-apk/app/build/outputs/apk/normal/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BusManager-MOD-uang
          path: bus-manager-apk/app/build/outputs/apk/mod/debug/*.apk
